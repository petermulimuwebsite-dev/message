backend:
  name: github
  repo: petermulimuwebsite-dev/message
  branch: main
  base_url: https://www.petermilimo.org
  auth_endpoint: /api/auth



media_folder: public/images
public_folder: /images

collections:

  # ── SITE CONFIG ──────────────────────────────────────
  - name: siteConfig
    label: "⚙️ Site Settings"
    files:
      - name: main
        label: Site Settings
        file: src/content/siteConfig/main.json
        fields:
          - { label: "Hero Title (line 1)", name: heroTitle, widget: string }
          - { label: "Hero Subtitle (line 2)", name: heroSubtitle, widget: string }
          - { label: "Hero Verse / Tagline", name: heroVerse, widget: text }
          - { label: "Hero Website Ref", name: heroRef, widget: string }
          - { label: "Ministry Intro Paragraph", name: ministryIntro, widget: text }
          - { label: "Ministry Body Paragraph", name: ministryBody, widget: text }
          - { label: "Stat — Years of Ministry", name: statYears, widget: string }
          - { label: "Stat — Families Restored", name: statFamilies, widget: string }
          - { label: "Stat — Ministry Pillars", name: statPillars, widget: string }
          - { label: "Contact Email", name: email, widget: string }
          - { label: "Facebook URL", name: facebookUrl, widget: string }
          - { label: "YouTube Main Channel URL", name: youtubeMainUrl, widget: string }
          - { label: "M-Pesa Paybill Number", name: paybillNumber, widget: string }
          - { label: "M-Pesa Account Number", name: accountNumber, widget: string }
          - { label: "M-Pesa Account Name", name: accountName, widget: string }
          - { label: "Book Price (e.g. KSh 1,200)", name: bookPrice, widget: string }
          - { label: "PayPal Email", name: paypalEmail, widget: string }

  # ── SERMONS ──────────────────────────────────────────
  - name: sermons
    label: "🎙️ Sermons"
    label_singular: Sermon
    folder: src/content/sermons
    create: true
    delete: true
    slug: "{{slug}}"
    extension: json
    format: json
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Speaker, name: speaker, widget: string, default: "Peter Milimo" }
      - { label: Date (e.g. May 2025), name: date, widget: string }
      - label: Category
        name: category
        widget: select
        options:
          - Marriage Restoration
          - Christian Leadership
          - Spiritual Awakening
          - Youth Empowerment
          - Christian Living
      - { label: Duration (e.g. 52 min), name: duration, widget: string }
      - { label: Scripture Verse, name: verse, widget: string, hint: 'e.g. "What God has joined together..." — Mark 10:9' }
      - { label: Excerpt / Description, name: excerpt, widget: text }
      - { label: YouTube URL (optional), name: youtubeUrl, widget: string, required: false }

  # ── BOOKS ────────────────────────────────────────────
  - name: books
    label: "📚 Books"
    label_singular: Book
    folder: src/content/books
    create: true
    delete: true
    slug: "{{slug}}"
    extension: json
    format: json
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Author, name: author, widget: string, default: "Peter Milimo" }
      - { label: Category / Genre, name: cat, widget: string }
      - { label: Subtitle, name: sub, widget: string }
      - { label: Description, name: desc, widget: text }
      - { label: Price, name: price, widget: string, default: "KSh 1,200" }
      - { label: Format, name: format, widget: string, default: "Softcopy (PDF / eBook)" }
      - { label: Display Order, name: order, widget: number, default: 1 }

  # ── RESOURCES ────────────────────────────────────────
  - name: resources
    label: "📄 Resources (Free Downloads)"
    label_singular: Resource
    folder: src/content/resources
    create: true
    delete: true
    slug: "{{slug}}"
    extension: json
    format: json
    fields:
      - label: Title
        name: title
        widget: string
      - label: Tag / Category
        name: tag
        widget: select
        options:
          - Marriage
          - Marriage Restoration
          - Leadership
          - Spiritual Awakening
          - Youth Empowerment
          - Christian Living
      - label: Description
        name: desc
        widget: text
      - label: "Pages (e.g. 24 pages)"
        name: pages
        widget: string
      - label: "File Size (e.g. 1.2 MB)"
        name: size
        widget: string
      - label: Download URL (use # if not ready)
        name: url
        widget: string
        default: "#"
      - label: Display Order
        name: order
        widget: number
        default: 1